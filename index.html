<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard VIVO - Google Sign-In</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      margin: 0; padding: 2rem;
      display: flex; flex-direction: column; align-items: center;
    }
    .glass {
      background: rgba(255 255 255 / 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1 class="text-3xl font-bold mb-8">Dashboard VIVO Banyuwangi</h1>

  <!-- Google sign-in button -->
  <div id="g_id_onload"
    data-client_id="179406952621-181c09hej1ee7cu0gqs7k15s6g6pmbao.apps.googleusercontent.com"
    data-context="signin"
    data-ux_mode="popup"
    data-callback="handleCredentialResponse"
    data-auto_prompt="false">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div id="loading" class="glass hidden text-center">
    <i class="fas fa-spinner fa-spin text-yellow-400 text-4xl mb-2"></i>
    <p>Memuat dashboard...</p>
  </div>

  <main id="dashboard" class="glass hidden">
    <p><strong>Nama:</strong> <span id="userName"></span></p>
    <p><strong>Level:</strong> <span id="userLevel"></span></p>
    <p><strong>Area:</strong> <span id="userArea"></span></p>
    <button id="signOutBtn" class="mt-4 bg-yellow-400 text-black px-4 py-2 rounded">Logout</button>
  </main>

  <script>

    const API_BASE = 'https://script.google.com/macros/s/AKfycbw8Qqwz0BDtkY3x9asjpzjFqkUrc4EqA7-LhIu7Vj1jZ-pccMzQrLD7Kv9aXlCPeCS4/exec';

    let currentUser = null;

    function handleCredentialResponse(response) {
      if (!response.credential) {
        alert('Login gagal');
        return;
      }
      document.querySelector('.g_id_signin').style.display = 'none';
      document.getElementById('loading').classList.remove('hidden');

      const payload = parseJwt(response.credential);
      // Gunakan email dari payload sebagai ID user
      const userId = payload.email;

      fetchUserData(userId, response.credential);
    }

    async function fetchUserData(userId, idToken) {
      try {
        const url = `${API_BASE}?action=login&id=${encodeURIComponent(userId)}&idToken=${encodeURIComponent(idToken)}`;
        const res = await fetch(url, {
          headers: { 'Authorization': 'Bearer ' + idToken }
        });
        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error);
          google.accounts.id.revoke(userId, () => location.reload());
          return;
        }
        currentUser = data.user;
        showDashboard();
      } catch(e) {
        alert('Kesalahan jaringan: ' + e.message);
        location.reload();
      }
    }

    function showDashboard() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userLevel').textContent = currentUser.level;
      document.getElementById('userArea').textContent = currentUser.area;
    }

    function parseJwt (token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    document.getElementById('signOutBtn').onclick = () => {
      google.accounts.id.disableAutoSelect();
      currentUser = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.querySelector('.g_id_signin').style.display = 'block';
    };

  </script>
</body>
</html>
